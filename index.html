<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nanasi Bakery | Elvis Creative</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: #fff;
        }

        header {
            padding: 25px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            margin-left: 25px;
            font-size: 14px;
        }

        .hero {
            min-height: 55vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 60px 20px;
        }

        .hero h1 {
            font-size: clamp(50px, 9vw, 100px);
            letter-spacing: 5px;
            margin-bottom: 20px;
        }

        .hero p {
            color: #bbb;
            font-size: 18px;
        }

        .credit {
            margin-top: 15px;
            font-size: 13px;
            color: #777;
            letter-spacing: 2px;
        }

        .gallery-section {
            padding: 70px 7%;
        }

        .section-title {
            text-align: center;
            margin-bottom: 45px;
        }

        .section-title h2 {
            font-size: 36px;
            margin-bottom: 12px;
        }

        .section-title p {
            color: #888;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .photo {
            height: 420px;
            background: #222;
            overflow: hidden;
        }

        .photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.5s ease;
        }

        .photo:hover img {
            transform: scale(1.05);
        }

        .placeholder {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
        }

        footer {
            margin-top: 80px;
            padding: 30px;
            text-align: center;
            border-top: 1px solid #333;
            color: #666;
            font-size: 13px;
        }

        @media (max-width: 800px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            .gallery {
                grid-template-columns: 1fr;
            }

            nav {
                display: none;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        ELVIS CREATIVE
    </div>

    <nav>
        <a href="#">Home</a>
        <a href="#gallery">Gallery</a>
    </nav>

</header>


<section class="hero">

    <div>

        <h1>NANASI BAKERY</h1>

        <p>
            Cake & Product Photography
        </p>

        <div class="credit">
            PHOTOGRAPHY BY ELVIS CREATIVE
        </div>

    </div>

</section>


<section class="gallery-section" id="gallery">

    <div class="section-title">

        <h2>Our Gallery</h2>

        <p>
            A selection of cakes and creative work from Nanasi Bakery.
        </p>

    </div>


 <div class="gallery" id="photoGallery"></div>

<script>
    const gallery = document.getElementById("photoGallery");

    for (let i = 1; i <= 42; i++) {

        const photo = document.createElement("div");
        photo.className = "photo";

        const img = document.createElement("img");

      img.src = `./01%20JPG%20(${i}).jpg`;
        img.alt = `Nanasi Bakery Photo ${i}`;
        img.loading = "lazy";

        photo.appendChild(img);
        gallery.appendChild(photo);
    }
</script>
